name: Pre-launch gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prelaunch:
    name: Theme and store checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fail loudly rather than letting the gate report "could not run" for a
      # secret that was never configured.
      - name: Check credentials are configured
        env:
          STORE: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          missing=""
          if [ -z "$STORE" ]; then missing="$missing SHOPIFY_STORE_DOMAIN"; fi
          if [ -z "$CLIENT_ID" ]; then missing="$missing SHOPIFY_CLIENT_ID"; fi
          if [ -z "$CLIENT_SECRET" ]; then missing="$missing SHOPIFY_CLIENT_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Shopify app credentials present."

      # Shopify issues no long-lived token to copy for a Dev Dashboard app, so
      # the app's own credentials are traded for one here. The token lives for
      # 24 hours and is masked in the log.
      - name: Mint Admin API token
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/mint-admin-token.mjs

      - name: Run pre-launch gate
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
        run: node scripts/prelaunch.mjs
