name: Pre-launch gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prelaunch:
    name: Theme and store checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fail loudly rather than letting the gate report "could not run" for a
      # secret that was never configured.
      - name: Check credentials are configured
        env:
          STORE: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          missing=""
          if [ -z "$STORE" ]; then missing="$missing SHOPIFY_STORE_DOMAIN"; fi
          if [ -z "$TOKEN" ] && { [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; }; then
            missing="$missing SHOPIFY_ADMIN_TOKEN (or both SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Shopify credentials present."

      # A stored token is used as-is. Otherwise the app's own credentials are
      # traded for one, because Shopify issues no long-lived token to copy for
      # an app created in the Dev Dashboard. The minted token lasts 24 hours and
      # is masked in the log.
      - name: Obtain Admin API token
        env:
          SUPPLIED_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [ -n "$SUPPLIED_TOKEN" ]; then
            echo "::add-mask::$SUPPLIED_TOKEN"
            echo "SHOPIFY_ADMIN_TOKEN=$SUPPLIED_TOKEN" >> "$GITHUB_ENV"
            echo "Using the Admin API token from repository secrets."
          else
            node scripts/mint-admin-token.mjs
          fi

      - name: Run pre-launch gate
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
        run: node scripts/prelaunch.mjs
