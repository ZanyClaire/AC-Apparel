name: Publish theme branch

# Shopify's GitHub integration only accepts a theme whose files sit at the root
# of the connected branch, and this repository's root is the static storefront.
# This mirrors theme/ onto a generated `shopify-theme` branch, so
# Online Store > Themes > Add theme > Connect from GitHub has a valid theme to
# read. Edit theme/ on main; never edit the generated branch.

on:
  push:
    branches: [main]
    paths: ['theme/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-theme-branch
  cancel-in-progress: true

jobs:
  publish:
    name: Mirror theme/ to shopify-theme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # A broken theme should never reach the branch Shopify is watching.
      - name: Check the theme still validates
        run: node scripts/validate-theme.mjs

      - name: Push theme contents to the shopify-theme branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # Flat mirror: theme/layout goes to /layout. The theme's README is
          # documentation, not part of the theme, so it is left behind.
          cp -R theme/. "$work/"
          rm -f "$work/README.md"
          cd "$work"
          git init -q
          git checkout -q -b shopify-theme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish theme from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shopify-theme
